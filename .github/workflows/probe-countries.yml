name: Descubrir nombres de país en GDELT (una vez)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/probe.mjs
      - name: Guardar el resultado
        run: |
          git config user.name "meridiano-bot"
          git config user.email "meridiano-bot@users.noreply.github.com"
          git add config/gdelt-names.json
          git diff --cached --quiet || (git commit -m "Nombres de país resueltos para GDELT" && git pull --rebase && git push)
