<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Meridiano · Las noticias del mundo</title>
<meta name="description" content="Las noticias del mundo, país por país y tema por tema.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --black: #000000;
    --white: #ffffff;
    --purple: #9d1cff;
    --gray: #8b8b94;
    --gray-dark: #2a2a2f;
    --menu-w: 290px;
    --font: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { height: 100%; background: var(--black); scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    height: 100%; margin: 0; position: relative; overflow: hidden;
    background: var(--black); color: var(--white);
    font-family: var(--font); -webkit-font-smoothing: antialiased;
  }

  /* Cabecera */
  .brand {
    position: absolute; top: 0; left: 0; z-index: 3;
    padding: clamp(18px, 3vw, 36px);
    display: flex; align-items: center; gap: 14px; pointer-events: none;
  }
  .brand svg { width: clamp(30px, 3.4vw, 42px); height: auto; flex: none; }
  .brand h1 {
    margin: 0; font-weight: 800; font-size: clamp(28px, 3.6vw, 46px);
    letter-spacing: -0.035em; line-height: 1; font-variation-settings: "opsz" 96;
  }
  .brand p { margin: 6px 0 0; font-size: clamp(13px, 1.1vw, 15px); color: var(--gray); font-weight: 400; letter-spacing: 0; }

  /* Mapa */
  #stage { position: absolute; inset: 0; z-index: 1; }
  #map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  #map.dragging { cursor: grabbing; }
  .country {
    fill: var(--purple); stroke: var(--black); stroke-width: var(--sw, 0.5);
    stroke-linejoin: round; cursor: pointer; outline: none;
    transition: fill 0.12s ease-out;
    opacity: 0; animation: reveal 0.7s ease-out forwards; animation-delay: calc(var(--d) * 1ms);
  }
  @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
  #world.ready .country { animation: none; opacity: 1; }
  .country:hover { fill: var(--gray); }
  .country.selected, .country.selected:hover { fill: var(--white); }
  .country:focus-visible { fill: var(--gray); stroke: var(--white); stroke-width: calc(var(--sw, 0.5) * 3); }
  .country.selected:focus-visible { stroke: var(--purple); }

  /* Etiqueta flotante */
  #tip {
    position: fixed; z-index: 5; left: 0; top: 0; pointer-events: none;
    background: var(--black); color: var(--white); border: 1px solid var(--gray-dark);
    padding: 7px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap;
    opacity: 0; transform: translate(-50%, -150%); transition: opacity 0.1s;
  }
  #tip.on { opacity: 1; }

  /* Pie: país elegido */
  .status {
    position: absolute; left: 0; bottom: 0; z-index: 3;
    padding: clamp(18px, 3vw, 36px); pointer-events: none; max-width: calc(100% - 140px);
  }
  .status .hint { margin: 0; color: var(--gray); font-size: clamp(14px, 1.3vw, 17px); }
  .status .name {
    margin: 0; font-weight: 800; font-size: clamp(34px, 6vw, 84px); line-height: 0.95;
    letter-spacing: -0.04em; font-variation-settings: "opsz" 96; overflow-wrap: anywhere;
  }
  .status[data-empty="true"] .name { display: none; }
  .status[data-empty="false"] .hint { display: none; }

  /* Zoom */
  .zoom {
    position: absolute; right: 0; bottom: 0; z-index: 4;
    padding: clamp(18px, 3vw, 36px); display: flex; flex-direction: column; gap: 8px;
  }
  .zoom button {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--gray-dark);
    background: var(--black); color: var(--white); font: 500 22px/1 var(--font); cursor: pointer;
    display: grid; place-items: center; padding: 0; transition: border-color 0.12s, background 0.12s;
  }
  .zoom button:hover { border-color: var(--purple); }
  .zoom button:active { background: var(--purple); }
  .zoom button:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
  .zoom svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }


  /* Estado: sin país elegido */
  .status[data-empty="false"] { display: none; }

  /* El mapa se encoge para dejar sitio al menú */
  #stage { transition: right 0.25s ease-out, bottom 0.25s ease-out; }
  body.menu-open #stage { right: var(--menu-w); }
  .zoom { transition: right 0.25s ease-out, bottom 0.25s ease-out; }
  body.menu-open .zoom { right: var(--menu-w); }

  /* Menú del país */
  .menu {
    position: absolute; top: 0; right: 0; bottom: 0; width: var(--menu-w); z-index: 6;
    background: var(--black); border-left: 1px solid var(--gray-dark);
    display: flex; flex-direction: column;
    transform: translateX(100%); visibility: hidden;
    transition: transform 0.25s ease-out, visibility 0s linear 0.25s;
  }
  body.menu-open .menu { transform: none; visibility: visible; transition-delay: 0s; }
  .menu-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 22px 20px 18px; }
  .menu-head h2 {
    margin: 0; font-weight: 800; font-size: 28px; line-height: 1; letter-spacing: -0.035em;
    font-variation-settings: "opsz" 96; overflow-wrap: anywhere;
  }
  .icon-btn {
    flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--gray-dark);
    background: var(--black); color: var(--white); cursor: pointer; padding: 0; display: grid; place-items: center;
    transition: border-color 0.12s;
  }
  .icon-btn:hover { border-color: var(--purple); }
  .icon-btn:focus-visible, .group > button:focus-visible, .sub button:focus-visible, .pill:focus-visible { outline: 2px solid var(--white); outline-offset: -2px; }
  .icon-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

  .groups { list-style: none; margin: 0; padding: 0 0 16px; overflow-y: auto; flex: 1; overscroll-behavior: contain; }
  .group > button {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 20px; border: 0; border-top: 1px solid var(--gray-dark); background: transparent; color: var(--white);
    font: 500 16px/1.25 var(--font); text-align: left; cursor: pointer; transition: background 0.1s;
  }
  .group:last-child > button { border-bottom: 1px solid var(--gray-dark); }
  .group > button svg { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .group.has > button { box-shadow: inset 3px 0 0 var(--purple); }
  .group.active > button { background: var(--purple); box-shadow: none; }

  .sub {
    display: none; list-style: none; margin: 0; padding: 6px; width: 310px;
    position: fixed; z-index: 8; background: var(--black); border: 1px solid var(--gray-dark);
  }
  .group.active > .sub { display: block; }
  .sub button {
    width: 100%; display: block; padding: 10px 14px; border: 0; border-radius: 8px; background: transparent;
    color: var(--white); font: 500 15px/1.25 var(--font); text-align: left; cursor: pointer; transition: background 0.1s;
  }
  .sub button:hover { background: var(--gray-dark); }
  .sub .detail { display: block; margin-top: 3px; color: var(--gray); font-weight: 400; font-size: 12.5px; }
  .sub button.sel, .sub button.sel:hover { background: var(--white); color: var(--black); }
  .sub button.sel .detail { color: #5a5a63; }

  /* Vista de noticias (vacía por ahora) */
  #news {
    position: absolute; inset: 0; z-index: 2; background: var(--black); display: none; flex-direction: column;
    padding: 124px clamp(18px, 3vw, 36px) clamp(18px, 3vw, 36px);
  }
  #news.on { display: flex; }
  body.menu-open #news { right: var(--menu-w); }
  #news .crumb { margin: 0 0 10px; color: var(--gray); font-size: 15px; }
  #news h3 {
    margin: 0; font-weight: 800; font-size: clamp(32px, 5.4vw, 76px); line-height: 0.98; letter-spacing: -0.04em;
    font-variation-settings: "opsz" 96; max-width: 16ch; overflow-wrap: anywhere;
  }
  #news .feed { flex: 1; margin-top: 32px; border-top: 1px solid var(--gray-dark); padding-top: 22px; }
  .pill {
    align-self: flex-start; height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--gray-dark);
    background: var(--black); color: var(--white); font: 500 15px/1 var(--font); cursor: pointer; transition: border-color 0.12s;
  }
  .pill:hover { border-color: var(--purple); }


  /* Noticias */
  #news { overflow-y: auto; overscroll-behavior: contain; }
  #news .meta { margin: 14px 0 0; color: var(--gray); font-size: 14px; }
  #news .feed { flex: none; max-width: 780px; margin-top: 22px; padding-top: 6px; }
  #news .feed .empty { margin: 0; padding-top: 18px; color: var(--gray); font-size: 16px; max-width: 44ch; }
  #news .feed .item { padding: 20px 0; border-bottom: 1px solid var(--gray-dark); }
  #news .feed .item:first-child { padding-top: 18px; }
  #news .feed .item .m { margin: 0 0 7px; max-width: none; color: var(--gray); font-size: 13.5px; }
  #news .feed .item h4 { margin: 0 0 7px; font: 500 20px/1.25 var(--font); letter-spacing: -0.01em; }
  #news .feed .item .s { margin: 0 0 11px; max-width: 66ch; color: #b4b4bc; font-size: 15px; line-height: 1.5; }
  #news .feed .item a { color: var(--white); font-size: 14px; text-decoration: underline; text-decoration-color: var(--purple); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  #news .feed .item a:hover { color: var(--purple); }
  #news .feed .item a:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }
  #news .feed .item .nolink { color: var(--gray); font-size: 14px; }
  #news { padding-bottom: 0; }
  #news .backbar { position: sticky; bottom: 0; margin-top: auto; padding: 18px 0 clamp(18px, 3vw, 36px); background: var(--black); }
  body.news-open .zoom { display: none; }
  .brand { will-change: transform; }


  .demo { margin: 16px 0 0; max-width: 860px; padding: 10px 14px; border: 1px solid var(--gray-dark); color: var(--white); font-size: 14px; line-height: 1.45; }

  #news .credit { max-width: 860px; margin: 32px 0 0; color: var(--gray); font-size: 12.5px; line-height: 1.5; }

  /* Imágenes con marco fino */
  .frame { border: 1px solid var(--purple); background: var(--black); overflow: hidden; line-height: 0; }
  .frame svg, .frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
  #news .hero { max-width: 860px; aspect-ratio: 39 / 10; margin-top: 22px; }
  #news .feed { max-width: 860px; margin-top: 26px; }
  #news .feed .item { display: grid; grid-template-columns: minmax(0, 1fr) 210px; column-gap: 24px; align-items: start; }
  #news .feed .item .thumb { grid-column: 2; grid-row: 1; aspect-ratio: 16 / 10; }
  #news .feed .item .body { grid-column: 1; grid-row: 1; min-width: 0; }


  /* Opiniones */
  .opinions { max-width: 860px; margin-top: 44px; padding-top: 28px; border-top: 1px solid var(--gray-dark); }
  .op-title { margin: 0; font-weight: 800; font-size: 28px; line-height: 1; letter-spacing: -0.03em; font-variation-settings: "opsz" 96; }
  .op-sub { margin: 8px 0 0; color: var(--gray); font-size: 14px; }
  .op-form { margin-top: 18px; }
  .op-form[hidden], .op-note:empty { display: none; }
  .op-form textarea {
    display: block; width: 100%; min-height: 92px; max-height: 320px; resize: vertical; padding: 12px 14px;
    background: var(--black); color: var(--white); border: 1px solid var(--gray-dark); border-radius: 0;
    font: 400 16px/1.45 var(--font);
  }
  .op-form textarea::placeholder { color: var(--gray); }
  .op-form textarea:focus { outline: none; border-color: var(--purple); box-shadow: 0 0 0 1px var(--purple); }
  .op-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; color: var(--gray); font-size: 13px; }
  .btn {
    height: 40px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--purple); background: var(--purple);
    color: var(--white); font: 500 15px/1 var(--font); cursor: pointer; transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .btn:not(:disabled):hover { background: var(--white); border-color: var(--white); color: var(--black); }
  .btn:disabled { background: transparent; border-color: var(--gray-dark); color: var(--gray); cursor: not-allowed; }
  .btn:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
  .op-rules { margin: 10px 0 0; color: var(--gray); font-size: 12.5px; }
  .op-note { margin: 12px 0 0; color: var(--white); font-size: 14px; }
  .op-list { margin-top: 10px; }
  .op { padding: 16px 0; border-bottom: 1px solid var(--gray-dark); }
  .op .oh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 6px; color: var(--gray); font-size: 13.5px; }
  .op .oh strong { color: var(--white); font-weight: 500; font-size: 15px; }
  .op .ot { margin: 0; color: var(--white); font-size: 16px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .op .del { margin-left: auto; padding: 4px 0; border: 0; background: none; color: var(--gray); font: 400 13px var(--font); text-decoration: underline; cursor: pointer; }
  .op .del:hover { color: var(--white); }
  .op .del:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }


  /* Debate por noticia */
  #news .feed .item .acts { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 20px; }
  .debate {
    height: 34px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--gray-dark); background: var(--black);
    color: var(--white); font: 500 14px/1 var(--font); cursor: pointer; transition: border-color 0.12s;
  }
  .debate:hover, .debate[aria-expanded="true"] { border-color: var(--purple); }
  .debate:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
  #news .feed .item .thread { grid-column: 1 / -1; grid-row: 2; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--gray-dark); }
  .op-btns { display: flex; gap: 8px; }
  .btn.ghost { background: transparent; border-color: var(--gray-dark); color: var(--white); }
  .btn.ghost:not(:disabled):hover { background: transparent; border-color: var(--purple); color: var(--white); }
  .op .rp { margin: 6px 14px 0 0; padding: 4px 0; border: 0; background: none; color: var(--gray); font: 400 13px var(--font); text-decoration: underline; cursor: pointer; }
  .op .rp:hover { color: var(--white); }
  .op .rp:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
  .op .gone { margin: 0; color: var(--gray); font-size: 15px; font-style: italic; }
  .op .reps { margin: 10px 0 0 10px; padding-left: 16px; border-left: 1px solid var(--purple); }
  .op .reps .op { padding: 10px 0; border-bottom: 0; }
  .op .reps .op + .op { border-top: 1px solid var(--gray-dark); }
  .op .op-form { margin: 12px 0 0; }
  .op .op-form textarea { min-height: 70px; }

  @media (prefers-reduced-motion: reduce) {
    .country { animation: none; opacity: 1; transition: none; }
    #stage, .zoom, .menu { transition: none; }
  }
  @media (max-width: 600px) {
    .brand { align-items: flex-start; }
    .brand p { max-width: 190px; }
    .status { max-width: calc(100% - 90px); }
  }

  @media (max-width: 700px) {
    :root { --menu-w: 100%; }
    .menu { top: auto; left: 0; height: 52%; border-left: 0; border-top: 1px solid var(--gray-dark); transform: translateY(100%); }
    body.menu-open .menu { transform: none; }
    body.menu-open #stage { right: 0; bottom: 52%; }
    body.menu-open .zoom { right: 0; bottom: 52%; }
    body.menu-open #news { right: 0; bottom: 52%; padding-top: 104px; }
    .menu-head { padding: 16px 20px 12px; }
    .menu-head h2 { font-size: 24px; }
    .sub { position: static; width: auto; border: 0; padding: 0 10px 10px; }
    #news .feed { margin-top: 20px; }
    #news .hero { aspect-ratio: 16 / 6; margin-top: 18px; }
    #news .feed .item { grid-template-columns: 1fr; }
    #news .feed .item .thumb { grid-column: 1; grid-row: 1; aspect-ratio: 16 / 8; margin-bottom: 14px; }
    #news .feed .item .body { grid-row: 2; }
    #news .feed .item .thread { grid-row: 3; }
  }
</style>
</head>
<body>

<header class="brand">
  <svg viewBox="0 0 44 44" fill="none" stroke="#9d1cff" stroke-width="3.5" aria-hidden="true">
    <circle cx="22" cy="22" r="19"/>
    <ellipse cx="22" cy="22" rx="8" ry="19"/>
    <path d="M3 22h38" stroke-width="3"/>
  </svg>
  <div>
    <h1>Meridiano</h1>
    <p>Las noticias del mundo, país por país</p>
  </div>
</header>

<main id="stage">
  <svg id="map" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Mapa del mundo. Elige un país para ver sus noticias.">
    <g id="world"></g>
  </svg>
</main>

<div id="tip" role="presentation"></div>

<section class="status" data-empty="true" aria-live="polite">
  <p class="hint">Elige un país en el mapa</p>
</section>

<section id="news">
  <p class="crumb" id="crumb"></p>
  <h3 id="topicTitle"></h3>
  <p class="meta" id="newsMeta"></p>
  <p class="demo" id="demo" hidden></p>
  <div class="frame hero" id="hero" aria-hidden="true"></div>
  <div class="feed" id="feed"></div>
  <section class="opinions" id="opinions" aria-labelledby="opTitle">
    <p class="op-title" id="opTitle" role="heading" aria-level="2">Debate general del tema</p>
    <div id="opHost"></div>
  </section>
  <p class="credit">Titulares recopilados por GDELT Project y traducidos y clasificados automáticamente con IA; pueden contener errores. Las imágenes pertenecen a sus medios.</p>
  <div class="backbar"><button class="pill" id="back" type="button">Volver al mapa</button></div>
</section>

<aside class="menu" id="menu" aria-label="Temas de noticias">
  <div class="menu-head">
    <h2 id="menuName"></h2>
    <button class="icon-btn" id="menuClose" type="button" aria-label="Cerrar menú"><svg viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12"/></svg></button>
  </div>
  <ul class="groups" id="groups"></ul>
</aside>

<div class="zoom">
  <button id="zin" type="button" aria-label="Acercar"><svg viewBox="0 0 18 18"><path d="M9 3v12M3 9h12"/></svg></button>
  <button id="zout" type="button" aria-label="Alejar"><svg viewBox="0 0 18 18"><path d="M3 9h12"/></svg></button>
  <button id="zreset" type="button" aria-label="Ver el mundo entero"><svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="6.5"/><path d="M2.5 9h13M9 2.5c-3 3.5-3 9.5 0 13M9 2.5c3 3.5 3 9.5 0 13"/></svg></button>

const newsCache = {};
async function getNews(code) {
  if (!code) return null;
  if (!(code in newsCache)) {
    try {
      const r = await fetch(DATA_BASE + 'news/' + code + '.json', { cache: 'no-cache' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      newsCache[code] = j && Array.isArray(j.items) ? j : null;
    } catch (e) { newsCache[code] = null; }
  }
  return newsCache[code];
}

        for (let i = 0; i <= 40; i++) { const x = w * i / 40, y = y0 + Math.sin(x / w * Math.PI * 2 * fr + ph + k * 0.5) * amp; d += (i ? 'L' : 'M') + f1(x) + ' ' + f1(y) + ' '; }
        s += `<path d="${d}" fill="none" stroke="${PU}" stroke-opacity="${f1(0.35 + k * 0.09)}" stroke-width="2"/>`;
      }
      s += `<circle cx="${f1(w * (0.72 + r() * 0.15))}" cy="${f1(h * 0.2)}" r="${f1(h * 0.07)}" fill="${WH}"/>`;
      return s;
    },
    // 6 Ciencia y tecnología: circuito
    (w, h, r) => {
      let s = ''; const nodes = [];
      for (let i = 0; i < 9; i++) nodes.push([Math.round((0.08 + 0.84 * r()) * w / 20) * 20, Math.round((0.12 + 0.76 * r()) * h / 20) * 20]);
      for (let i = 0; i < 8; i++) { const a = nodes[i], b = nodes[i + 1]; s += `<path d="M${a[0]} ${a[1]} H${b[0]} V${b[1]}" fill="none" stroke="${i % 3 ? PU : GR}" stroke-width="1.6"/>`; }
      s += `<rect x="${f1(w * 0.4)}" y="${f1(h * 0.33)}" width="${f1(w * 0.2)}" height="${f1(h * 0.34)}" fill="#000" stroke="${WH}" stroke-width="1.5"/>`;
      nodes.forEach((n, i) => { s += `<rect x="${n[0] - 4}" y="${n[1] - 4}" width="8" height="8" fill="${i % 4 === 0 ? WH : PU}"/>`; });
      return s;
    },
    // 7 Cultura: disco de vinilo y ecualizador
    (w, h, r) => {
      const cx = w * (0.6 + r() * 0.08), cy = h / 2, R = h * 0.44;
      let s = `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(R)}" fill="#000" stroke="${PU}" stroke-width="1.5"/>`;
      for (let k = 1; k <= 5; k++) s += `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(R * (0.36 + k * 0.11))}" fill="none" stroke="${PU}" stroke-opacity="0.45"/>`;
      s += `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(R * 0.28)}" fill="${PU}"/><circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(R * 0.05)}" fill="#000"/>`;
      for (let i = 0; i < 7; i++) { const bh = h * (0.15 + 0.5 * r()), x = w * 0.07 + i * w * 0.045; s += `<rect x="${f1(x)}" y="${f1(cy - bh / 2)}" width="${f1(w * 0.026)}" height="${f1(bh)}" fill="${i % 3 === 1 ? WH : GR}"/>`; }
      return s;
    },
    // 8 Deportes: campo
    (w, h, r) => {
      const m = Math.min(w, h) * 0.12, pw = Math.min(w - 2 * m, (h - 2 * m) * 1.55), ph = h - 2 * m, x = (w - pw) / 2, y = m;
      let s = `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(pw)}" height="${f1(ph)}" fill="none" stroke="${WH}" stroke-width="1.5"/>`;
      s += `<line x1="${f1(x + pw / 2)}" x2="${f1(x + pw / 2)}" y1="${f1(y)}" y2="${f1(y + ph)}" stroke="${WH}"/><circle cx="${f1(x + pw / 2)}" cy="${f1(y + ph / 2)}" r="${f1(ph * 0.18)}" fill="none" stroke="${PU}" stroke-width="2"/>`;
      s += `<rect x="${f1(x)}" y="${f1(y + ph * 0.25)}" width="${f1(pw * 0.14)}" height="${f1(ph * 0.5)}" fill="none" stroke="${GR}"/><rect x="${f1(x + pw * 0.86)}" y="${f1(y + ph * 0.25)}" width="${f1(pw * 0.14)}" height="${f1(ph * 0.5)}" fill="none" stroke="${GR}"/>`;
      const bx = x + pw * (0.55 + r() * 0.3), by = y + ph * (0.2 + r() * 0.6);
      s += `<path d="M${f1(x + pw * 0.12)} ${f1(y + ph * 0.8)} C${f1(x + pw * 0.3)} ${f1(y + ph * 0.1)} ${f1(x + pw * 0.5)} ${f1(y + ph * 0.95)} ${f1(bx)} ${f1(by)}" fill="none" stroke="${PU}" stroke-width="2" stroke-dasharray="6 5"/><circle cx="${f1(bx)}" cy="${f1(by)}" r="5" fill="${WH}"/>`;
      return s;
    },
    // 9 Estilo de vida: formas abstractas
    (w, h, r) => {
      const cols = [PU, GR, WH, PU, GR]; let s = '';
      for (let i = 0; i < 6; i++) {
        const x = w * (0.1 + 0.8 * r()), y = h * (0.2 + 0.6 * r()), R = h * (0.1 + 0.2 * r()), c = cols[i % cols.length];
        s += i % 2 ? `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(R)}" fill="${c}" fill-opacity="0.9"/>` : `<path d="M${f1(x - R)} ${f1(y)} A${f1(R)} ${f1(R)} 0 0 1 ${f1(x + R)} ${f1(y)} Z" fill="${c}"/>`;
      }
      s += `<circle cx="${f1(w * (0.3 + r() * 0.4))}" cy="${f1(h * 0.5)}" r="${f1(h * 0.3)}" fill="none" stroke="${WH}" stroke-width="1.5"/>`;
      return s;
    },
    // 10 Opinión: comillas y líneas de texto
    (w, h, r) => {
      const qx = w * 0.16, qy = h * 0.4, qr = h * 0.1; let s = '';
      [0, 1].forEach((i) => { const x = qx + i * qr * 2.7; s += `<circle cx="${f1(x)}" cy="${f1(qy)}" r="${f1(qr)}" fill="${PU}"/><path d="M${f1(x + qr * 0.9)} ${f1(qy - qr * 0.2)} Q${f1(x + qr * 0.9)} ${f1(qy + qr * 2)} ${f1(x - qr * 0.8)} ${f1(qy + qr * 2.1)}" fill="none" stroke="${PU}" stroke-width="${f1(qr * 0.55)}"/>`; });
      for (let i = 0; i < 6; i++) s += `<rect x="${f1(w * 0.46)}" y="${f1(h * (0.2 + i * 0.12))}" width="${f1(w * (0.3 + 0.2 * r()))}" height="5" rx="2.5" fill="${i === 2 ? WH : GR}"/>`;
      return s;
    }
  ];
  const artSVG = (g, seed, w, h) =>
    `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="${w}" height="${h}" fill="#000"/>${ART[g](w, h, rng(hashStr(seed)))}</svg>`;

  // ---- Debate: opiniones y respuestas (base de datos compartida) ----
  const OP_MAX = 500, OP_GAP = 10000;
  let dbRef = null, userRef = null, myId = null, canWrite = true, isMod = false, opsReady = false, lastPost = 0;
  const nameCache = {};
  let threads = [];
  const opHost = document.getElementById('opHost');
  const HAS_DEBATE = !!(window.claude && window.claude.use);
  document.getElementById('opinions').hidden = !HAS_DEBATE;

  const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const opErr = (e) => {
    const c = e && e.code;
    if (c === 'invalid_argument') { canWrite = false; threads.forEach((t) => t.paint()); return 'Tu acceso solo permite leer las opiniones.'; }
    if (c === 'quota_exceeded') return 'Se ha alcanzado el límite de opiniones guardadas.';
    if (c === 'resource_exhausted') return 'Demasiadas acciones seguidas. Espera un momento.';
    if (c === 'revoked') return 'Ya no tienes acceso a las opiniones.';
    return 'No se pudo completar la acción. Inténtalo de nuevo.';
  };

  // Caja para escribir (sirve para opiniones y para respuestas)
  function composer(o) {
    const box = mk('div', 'op-form');
    const ta = mk('textarea'); ta.maxLength = OP_MAX; ta.rows = o.rows || 3; ta.placeholder = o.placeholder;
    ta.setAttribute('aria-label', o.placeholder); ta.value = o.initial || '';
    const row = mk('div', 'op-row'), chars = mk('span'), btns = mk('span', 'op-btns');
    const btn = mk('button', 'btn', o.submitLabel || 'Publicar opinión'); btn.type = 'button';
    const note = mk('p', 'op-note'); note.setAttribute('aria-live', 'polite');
    let busy = false;
    const sync = () => {
      chars.textContent = ta.value.length + ' / ' + OP_MAX;
      btn.disabled = busy || ta.value.trim().length < 2;
      if (o.onInput) o.onInput(ta.value);
    };
    const send = async () => {
      const text = ta.value.trim().slice(0, OP_MAX);
      if (text.length < 2 || busy) return;
      const now = Date.now();
      if (now - lastPost < OP_GAP) { note.textContent = 'Espera unos segundos antes de publicar otra opinión.'; return; }
      busy = true; sync(); note.textContent = '';
      try {
        await o.onSubmit(text); lastPost = now; ta.value = ''; busy = false; sync();
        if (o.onDone) o.onDone();
      } catch (e) { busy = false; note.textContent = opErr(e); sync(); }
    };
    ta.addEventListener('input', sync);
    ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } });
    btn.addEventListener('click', send);
    if (o.onCancel) { const c = mk('button', 'btn ghost', 'Cancelar'); c.type = 'button'; c.addEventListener('click', o.onCancel); btns.appendChild(c); }
    btns.appendChild(btn); row.append(chars, btns); box.append(ta, row, note);
    sync();
    return { el: box, ta };
  }

  // Hilo de debate: una noticia (o un tema) = una colección compartida
  function createThread(key, o) {
    const th = { key, items: [], unsub: null, timer: 0, tok: 0, loaded: false, shown: false, dirty: false, pending: false,
                 replyOpen: null, replyTo: null, replyText: '', el: mk('div', 'thread-body') };
    const status = mk('p', 'op-sub', 'Cargando opiniones…'), formHost = mk('div'), msg = mk('p', 'op-note'), list = mk('div', 'op-list');
    msg.setAttribute('aria-live', 'polite');
    const col = () => dbRef.collection('opiniones/' + key + '/items');
    const top = composer({
      placeholder: o.placeholder, submitLabel: 'Publicar opinión',
      onSubmit: (text) => col().add({ uid: myId || null, text, ts: Date.now(), parent: null, to: null })
    });
    formHost.append(top.el, mk('p', 'op-rules', 'Sé respetuoso: las opiniones ofensivas se eliminan.'));
    formHost.hidden = true;
    th.el.append(status, formHost, msg, list);
    th.paint = () => { formHost.hidden = !(dbRef && canWrite); if (th.shown && th.loaded) th.draw(); };
    th.focusTop = () => { if (!formHost.hidden) top.ta.focus(); };
    th.show = (v) => { th.shown = v; if (v && (th.loaded || th.dirty)) th.draw(); };
    th.stop = () => { if (th.unsub) { th.unsub(); th.unsub = null; } clearTimeout(th.timer); th.pending = false; };
    th.start = () => {
      if (th.unsub) return;
      if (!opsReady) { th.pending = true; return; }
      th.paint();
      if (!dbRef) { status.textContent = 'Inicia sesión en claude.ai para ver y dejar opiniones.'; return; }
      th.timer = setTimeout(() => { if (!th.loaded) status.textContent = 'No se pueden cargar las opiniones ahora mismo.'; }, 10000);
      try {
        th.unsub = col().orderBy('ts', 'desc').limit(300).onSnapshot((snap) => {
          th.loaded = true; clearTimeout(th.timer);
          th.items = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
          if (o.onCount) o.onCount(th.items.filter((i) => !i.deleted).length);
          if (th.shown) th.draw(); else th.dirty = true;
        }, (e) => { clearTimeout(th.timer); status.textContent = opErr(e); });
      } catch (e) { clearTimeout(th.timer); status.textContent = opErr(e); }
    };

    const nm = (uid) => (uid && uid === myId) ? 'Tú' : ((uid && nameCache[uid]) || 'Lector');
    const fmt = (ts) => typeof ts === 'number' ? new Date(ts).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    const confirmDel = (label, action) => {
      const b = mk('button', 'del', label); b.type = 'button';
      let armed = false, tm = 0;
      b.addEventListener('click', async () => {
        if (!armed) { armed = true; b.textContent = 'Confirmar eliminación'; tm = setTimeout(() => { armed = false; b.textContent = label; }, 4000); return; }
        clearTimeout(tm); b.disabled = true; msg.textContent = '';
        try { await action(); } catch (e) { b.disabled = false; armed = false; b.textContent = label; msg.textContent = opErr(e); }
      });
      return b;
    };

    th.draw = async () => {
      const tok = ++th.tok; th.dirty = false;
      const all = th.items.filter((i) => i && typeof i.id === 'string');
      const tops = all.filter((i) => !i.parent).sort((a, b) => (b.ts || 0) - (a.ts || 0));
      const kids = {};
      all.filter((i) => i.parent && !i.deleted).sort((a, b) => (a.ts || 0) - (b.ts || 0)).forEach((i) => { (kids[i.parent] = kids[i.parent] || []).push(i); });
      const visible = all.filter((i) => !i.deleted && (!i.parent || tops.some((t) => t.id === i.parent))).length;
      status.textContent = tops.length ? visible + (visible === 1 ? ' opinión' : ' opiniones') : 'Todavía no hay opiniones. Sé la primera persona en opinar.';
      const missing = [...new Set(all.filter((i) => !i.deleted).flatMap((i) => [i.uid, i.to]).filter((u) => u && !(u in nameCache)))];
      if (userRef && missing.length) {
        try { const ps = await userRef.profiles(missing); missing.forEach((id) => { nameCache[id] = (ps[id] && ps[id].name) || ''; }); } catch (e) {}
      }
      if (tok !== th.tok) return;
      const ae = document.activeElement, hadFocus = !!(ae && ae.tagName === 'TEXTAREA' && list.contains(ae)), pos = hadFocus ? ae.selectionStart : 0;
      list.textContent = '';
      let replyBox = null;

      const entry = (it, root, isReply) => {
        const art = mk('article', 'op');
        if (it.deleted) { art.appendChild(mk('p', 'gone', 'Opinión eliminada')); return art; }
        const head = mk('p', 'oh');
        head.appendChild(mk('strong', null, nm(it.uid)));
        if (isReply && it.to) head.appendChild(mk('span', null, 'en respuesta a ' + nm(it.to)));
        head.appendChild(mk('span', null, fmt(it.ts)));
        const replies = kids[it.id] || [];
        if (dbRef && (isMod || (myId && it.uid === myId))) {
          head.appendChild(confirmDel('Eliminar', async () => {
            if (!isReply && replies.length) await col().doc(it.id).update({ deleted: true, text: '' });
            else await col().doc(it.id).delete();
          }));
        }
        art.append(head, mk('p', 'ot', typeof it.text === 'string' ? it.text : ''));
        if (dbRef && canWrite) {
          const rp = mk('button', 'rp', 'Responder'); rp.type = 'button';
          rp.addEventListener('click', () => {
            if (th.replyOpen === root && th.replyTo === it.uid && th.replyKey === it.id) { th.replyOpen = null; }
            else { th.replyOpen = root; th.replyTo = it.uid || null; th.replyKey = it.id; th.replyText = ''; th.replyFocus = true; }
            th.draw();
          });
          art.appendChild(rp);
        }
        if (th.replyOpen === root && th.replyKey === it.id) {
          const rc = composer({
            placeholder: 'Escribe tu respuesta…', rows: 2, submitLabel: 'Responder', initial: th.replyText,
            onInput: (v) => { th.replyText = v; },
            onCancel: () => { th.replyOpen = null; th.replyText = ''; th.draw(); },
            onSubmit: (text) => col().add({ uid: myId || null, text, ts: Date.now(), parent: root, to: th.replyTo || null }),
            onDone: () => { th.replyOpen = null; th.replyText = ''; th.draw(); }
          });
          replyBox = rc; art.appendChild(rc.el);
        }
        if (!isReply && replies.length) {
          const reps = mk('div', 'reps');
          replies.forEach((r) => reps.appendChild(entry(r, it.id, true)));
          art.appendChild(reps);
        }
        return art;
      };
      tops.forEach((it) => list.appendChild(entry(it, it.id, false)));
      if (replyBox && (hadFocus || th.replyFocus)) { replyBox.ta.focus(); const p = hadFocus ? pos : replyBox.ta.value.length; replyBox.ta.setSelectionRange(p, p); th.replyFocus = false; }
    };
    threads.push(th);
    return th;
  }
  function clearThreads() { threads.forEach((t) => t.stop()); threads = []; opHost.textContent = ''; }
  function mountTopicThread() {
    if (!HAS_DEBATE) return;
    const th = createThread((selected._code || ('x' + selected._idx)) + '_' + topic.g + '.' + topic.i, { placeholder: '¿Qué opinas de este tema?' });
    opHost.appendChild(th.el); th.show(true); th.start();
  }

  (async () => {
    try {
      if (window.claude && claude.use) {
        const [d, u] = await Promise.all([claude.use('db'), claude.use('user')]);
        dbRef = d; userRef = u;
        if (u) {
          try { myId = await u.id(); } catch (e) {}
          try { isMod = !!(await u.canEdit()); } catch (e) {}
          try { canWrite = (await u.can('data.write')) !== false; } catch (e) {}
        }
      }
    } catch (e) { dbRef = null; }
    opsReady = true;
    threads.forEach((t) => { if (t.pending) { t.pending = false; t.start(); } else t.paint(); });
  })();

  const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const fmtDate = (d) => {
    const p = d.split('-').map(Number);
    return p.length === 3 ? p[2] + ' ' + MESES[p[1] - 1] : MESES[p[1] - 1] + ' ' + p[0];
  };
  const sortKey = (d) => d.length === 7 ? d + '-00' : d;

  const moveBrand = () => { brand.style.transform = news.scrollTop > 0 ? 'translateY(' + (-news.scrollTop) + 'px)' : ''; };
  news.addEventListener('scroll', moveBrand, { passive: true });
  const resetScroll = () => { news.scrollTop = 0; moveBrand(); };

  const fmtUpdated = (iso) => {
    const d = new Date(iso);
    return Number.isNaN(d.getTime()) ? '' : d.toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  };
  let newsTok = 0;
  async function renderNews() {
    resetScroll();
    clearThreads();
    mountTopicThread();
    const [gTitle, items] = GROUPS[topic.g];
    const label = selected._label;
    crumb.textContent = label + ' / ' + gTitle;
    topicTitle.textContent = items[topic.i][0];
    const key = topic.g + '.' + topic.i;
    hero.innerHTML = artSVG(topic.g, key + ' ' + label, 780, 200);
    demo.hidden = true;
    newsMeta.textContent = '';
    feed.textContent = '';
    const say = (msg) => { feed.textContent = ''; const p = document.createElement('p'); p.className = 'empty'; p.textContent = msg; feed.appendChild(p); };
    say('Cargando noticias…');
    const tok = ++newsTok;
    const data = await getNews(selected._code);
    if (tok !== newsTok || !topic) return;
    if (!data) { say('Las noticias de ' + label + ' se conectarán próximamente.'); return; }
    const list = data.items.filter((n) => Array.isArray(n.k) && n.k.includes(key))
      .sort((a, b) => String(b.ts || b.d).localeCompare(String(a.ts || a.d)));
    if (!list.length) { say('Hoy no hay noticias de este tema en ' + label + '.'); return; }
    feed.textContent = '';
    newsMeta.textContent = list.length + (list.length === 1 ? ' noticia' : ' noticias') + ' · actualizado el ' + fmtUpdated(data.updatedAt);
    list.forEach((n) => {
      const art = document.createElement('article'); art.className = 'item';
      const thumb = document.createElement('div'); thumb.className = 'frame thumb'; thumb.setAttribute('aria-hidden', 'true');
      const fallback = () => { thumb.innerHTML = artSVG(topic.g, n.t, 320, 200); };
      if (n.img) {   // foto de la noticia; si no carga, se usa la ilustración
        const im = document.createElement('img'); im.alt = ''; im.loading = 'lazy'; im.referrerPolicy = 'no-referrer'; im.src = n.img;
        im.addEventListener('error', fallback); thumb.appendChild(im);
      } else fallback();
      const body = document.createElement('div'); body.className = 'body';
      const m = document.createElement('p'); m.className = 'm'; m.textContent = n.src + ' · ' + fmtDate(n.d);
      const h = document.createElement('h4'); h.textContent = n.t;
      body.append(m, h);
      if (n.s) { const s = document.createElement('p'); s.className = 's'; s.textContent = n.s; body.appendChild(s); }
      const acts = mk('div', 'acts');
      if (n.u) {
        const a = document.createElement('a'); a.href = n.u; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.textContent = 'Leer en ' + n.src; acts.appendChild(a);
      } else {
        acts.appendChild(mk('span', 'nolink', 'Datos de competición'));
      }
      body.appendChild(acts);
      art.append(thumb, body);
      if (HAS_DEBATE) {
        const nid = 'n_' + (n.id || hashStr(n.u || n.t).toString(36));
        const dbtn = mk('button', 'debate', 'Debatir'); dbtn.type = 'button';
        dbtn.setAttribute('aria-expanded', 'false'); dbtn.setAttribute('aria-controls', 'th-' + nid);
        const panel = mk('div', 'thread'); panel.id = 'th-' + nid; panel.hidden = true;
        const th = createThread(nid, { placeholder: 'Escribe tu opinión sobre esta noticia…', onCount: (c) => { dbtn.textContent = 'Debatir' + (c ? ' · ' + c : ''); } });
        panel.appendChild(th.el);
        dbtn.addEventListener('click', () => {
          const open = panel.hidden; panel.hidden = !open;
          dbtn.setAttribute('aria-expanded', String(open)); th.show(open);
          if (open) th.focusTop();
        });
        acts.appendChild(dbtn);
        th.start();
        art.appendChild(panel);
      }
      feed.appendChild(art);
    });
  }
  function openTopic(g, i) {
    topic = { g, i };
    tip.classList.remove('on');
    markTopic(); renderNews();
    news.classList.add('on');
    document.body.classList.add('news-open');
    stageEl.inert = true;
    if (mobile.matches && activeLi) deactivate(activeLi);
  }
  function closeNews() {
    topic = null; clearThreads(); news.classList.remove('on'); markTopic();
    document.body.classList.remove('news-open'); stageEl.inert = false; resetScroll();
  }
  function closeAll() {
    closeNews();
    if (activeLi) deactivate(activeLi);
    document.body.classList.remove('menu-open');
    status.dataset.empty = 'true';
  }

  function select(p) {
    if (selected) selected.classList.remove('selected');
    if (!p || selected === p) { selected = null; closeAll(); return; }
    selected = p; p.classList.add('selected');
    menuName.textContent = p._label;
    status.dataset.empty = 'false';
    document.body.classList.add('menu-open');
    if (topic) renderNews();
  }
  document.getElementById('menuClose').addEventListener('click', () => select(null));
  document.getElementById('back').addEventListener('click', closeNews);

  // Zoom y arrastre (con animación suave)
  const cur = { k: 1, tx: 0, ty: 0 };
  const tgt = { k: 1, tx: 0, ty: 0 };
  let raf = 0;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const paint = () => {
    world.setAttribute('transform', `translate(${cur.tx} ${cur.ty}) scale(${cur.k})`);
    world.style.setProperty('--sw', (0.5 / cur.k).toFixed(3));
  };
  const clampT = (s) => {
    s.tx = Math.min(0, Math.max(W - W * s.k, s.tx));
    s.ty = Math.min(0, Math.max(H - H * s.k, s.ty));
  };
  const toView = (clientX, clientY) => {
    const pt = svg.createSVGPoint(); pt.x = clientX; pt.y = clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  };
  function step() {
    raf = 0;
    const e = 0.2;
    cur.k += (tgt.k - cur.k) * e;
    cur.tx += (tgt.tx - cur.tx) * e;
    cur.ty += (tgt.ty - cur.ty) * e;
    const done = Math.abs(tgt.k - cur.k) < 0.002 && Math.abs(tgt.tx - cur.tx) < 0.05 && Math.abs(tgt.ty - cur.ty) < 0.05;
    if (done) { cur.k = tgt.k; cur.tx = tgt.tx; cur.ty = tgt.ty; }
    paint();
    if (!done) raf = requestAnimationFrame(step);
  }
  const animate = () => {
    if (reduceMotion) { cur.k = tgt.k; cur.tx = tgt.tx; cur.ty = tgt.ty; paint(); return; }
    if (!raf) raf = requestAnimationFrame(step);
  };
  const jump = () => { // movimiento directo (arrastrar / pellizcar), un pintado por frame
    cur.k = tgt.k; cur.tx = tgt.tx; cur.ty = tgt.ty;
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(); });
  };
  function zoomAt(vx, vy, factor, direct) {
    const nk = Math.min(14, Math.max(1, tgt.k * factor));
    const f = nk / tgt.k;
    tgt.tx = vx - (vx - tgt.tx) * f; tgt.ty = vy - (vy - tgt.ty) * f; tgt.k = nk;
    clampT(tgt);
    direct ? jump() : animate();
  }
  const center = () => { const r = svg.getBoundingClientRect(); return toView(r.left + r.width / 2, r.top + r.height / 2); };

  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
    const v = toView(e.clientX, e.clientY);
    zoomAt(v.x, v.y, Math.exp(-Math.max(-120, Math.min(120, dy)) * 0.0022), false);
  }, { passive: false });

  const pointers = new Map();
  let drag = null, moved = false, pinch = null;
  svg.addEventListener('pointerdown', (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved = false;
    if (pointers.size === 1) { drag = { x: e.clientX, y: e.clientY, tx: tgt.tx, ty: tgt.ty }; }
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; drag = null; moved = true;
    }
  });
  svg.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const v = toView((a.x + b.x) / 2, (a.y + b.y) / 2);
      zoomAt(v.x, v.y, d / pinch.d, true); pinch.d = d; return;
    }
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!moved && Math.hypot(dx, dy) > 5) { moved = true; svg.classList.add('dragging'); tip.classList.remove('on'); }
    if (moved) {
      const s = svg.getScreenCTM().a;
      tgt.tx = drag.tx + dx / s; tgt.ty = drag.ty + dy / s; clampT(tgt); jump();
    }
  });
  const end = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) { drag = null; svg.classList.remove('dragging'); }
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);

  // Clic en país (solo si no fue un arrastre)
  svg.addEventListener('click', (e) => {
    if (moved) { moved = false; return; }
    const p = e.target.closest('.country');
    select(p || null);
  });
  svg.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('country')) { e.preventDefault(); select(e.target); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (news.classList.contains('on')) closeNews(); else select(null); } });

  // Etiqueta al pasar el ratón
  svg.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch' || moved) return;
    const p = e.target.closest && e.target.closest('.country');
    if (!p) { tip.classList.remove('on'); return; }
    tip.textContent = p._label;
    tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px';
    tip.classList.add('on');
  });
  svg.addEventListener('pointerleave', () => tip.classList.remove('on'));

  // Botones
  document.getElementById('zin').addEventListener('click', () => { const c = center(); zoomAt(c.x, c.y, 1.6, false); });
  document.getElementById('zout').addEventListener('click', () => { const c = center(); zoomAt(c.x, c.y, 1 / 1.6, false); });
  document.getElementById('zreset').addEventListener('click', () => { tgt.k = 1; tgt.tx = 0; tgt.ty = 0; animate(); });
  setTimeout(() => world.classList.add('ready'), 1800);
})();
</script>
</body>
</html>
